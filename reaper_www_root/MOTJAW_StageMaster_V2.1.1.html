<!--
    ============================================================
                     MOTJAW StageMaster v2.1.1
                     HTML / JS Frontend Interface
    ============================================================

    Description:
      This is the main StageMaster interface used during live
      performance. It supports Vocal Mode (lyrics) and Setlist Mode
      (song list), with a shared footer showing progress bar, region
      colors, playhead, timers, and next track.

    Files in this version:
      • MOTJAW_StageMaster_v2.1.1.html
      • MOTJAW_Background_v2.1.1.lua
      • MOTJAW StageMaster_DEV_NOTES.md
      • MOTJAW StageMaster_RELEASE_NOTES.md
      • MOTJAW StageMaster_Changelog.md

    Documentation:
      Refer to the Dev Notes for architecture, JSON schema, mode logic,
      and developer guidelines.

    Contact:
      Tommy Turbide — tntconseil@gmail.com

    Project Summary:
      MOTJAW StageMaster bridges REAPER and the stage by converting
      project metadata into a clean, readable, performance‑ready UI.
      It provides auto‑scrolling lyrics, setlist navigation, and
      real‑time transport feedback for musicians.

    ============================================================
-->

<!DOCTYPE html>
<html>
<head>
    <title>MOTJAW Stage Interface - V2.1 Setlist Pulse</title>
    <meta charset="utf-8"/>
    <style>
* { box-sizing: border-box; }

body {
    background: #111;
    color: white;
    font-family: sans-serif;
    margin: 0;
    overflow: hidden;
}

/* MAIN LYRICS AREA */
#text {
    margin: auto;
    text-align: left;
    padding-left: 15%;
    padding-bottom: 150px;
}

.lyrics {
    opacity: 0.3;
    transition: all ease 0.3s;
    font-size: 3.5em;
    font-weight: bold;
    margin: 40px 0;
}

.current {
    opacity: 1;
    color: #00FFCC;
}

/* SETLIST MODE AREA */
#setlist-container {
    position: absolute;
    top: 80px;
    left: 0;
    right: 0;
    bottom: 140px;
    display: none;
    overflow-y: auto;
    padding: 40px 0;
}

#setlist-inner {
    width: 60%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.setlist-item {
    padding: 10px 20px;
    font-size: 1.8em;
    font-weight: 600;
    color: #ccc;
    background: #222;
    border-radius: 8px;
    transition: all 0.2s ease;
    text-align: left;
    border: 1px solid #333;
}

.setlist-item.current {
    color: #000;
    background: #00FFCC;
    border-color: #00FFCC;
    box-shadow: 0 0 20px rgba(0,255,204,0.7);
}

/* LOOP BLINK — 1 second pulse */
@keyframes loopBlink {
    0% {
        box-shadow: 0 0 5px rgba(0,255,204,0.3);
        transform: scale(1.00);
    }
    100% {
        box-shadow: 0 0 25px rgba(0,255,204,1.0);
        transform: scale(1.04);
    }
}

.setlist-item.current.looping {
    animation: loopBlink 1s infinite alternate;
}

/* MODE TOGGLE */
#mode-toggle {
    position: fixed;
    left: 15px;
    top: 20px;
    z-index: 2100;
    display: flex;
    gap: 10px;
}

.mode-btn {
    padding: 8px 14px;
    border-radius: 999px;
    border: 2px solid #555;
    background: #222;
    color: #ccc;
    font-weight: 700;
    font-size: 0.9em;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.15s ease;
}

.mode-btn.active {
    background: #00FFCC;
    color: #000;
    border-color: #00FFCC;
    box-shadow: 0 0 12px rgba(0,255,204,0.7);
}

/* FLOATING CONTROLS */
#floating-transport, #floating-repeat {
    position: fixed;
    right: 15px;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.8);
    font-weight: 900;
    z-index: 2000;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    background-color: rgba(51,51,51,0.9);
    backdrop-filter: blur(5px);
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.1s ease-in-out;
}

#floating-transport {
    top: 20px;
    background-color: rgba(0,255,0,0.9);
    color: black;
    font-size: 1.6em;
}

#floating-repeat {
    top: 165px;
    background-color: rgba(68,68,68,0.9);
    color: white;
    font-size: 1.1em;
    flex-direction: column;
    gap: 4px;
}

#floating-repeat.active {
    background-color: rgba(0,136,255,0.9);
    border-color: #fff;
    box-shadow: 0 0 20px rgba(0,136,255,0.6);
}

#repeat-status {
    font-size: 0.6em;
    background: rgba(0,0,0,0.5);
    padding: 2px 10px;
    border-radius: 12px;
    letter-spacing: 1px;
}

/* FOOTER */
#footer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100px;
    background: #000;
    border-top: 2px solid #333;
    display: flex;
    flex-direction: column;
    z-index: 1000;
}

/* REGION COLOR LAYER */
#region-layer {
    position: absolute;
    top: 0;
    left: 0;
    height: 20px;
    width: 100%;
    z-index: 1;
}

.region-block {
    position: absolute;
    top: 0;
    height: 100%;
}

/* PROGRESS BAR */
#progress-bar {
    position: absolute;
    top: 0;
    height: 10px;
    background: #00FFCC;
    width: 0%;
    z-index: 2;
}

/* Triangle cursor */
#playhead {
    position: absolute;
    top: -22px;
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 26px solid red;
    z-index: 3;
    transform: translateX(-50%);
}

/* FOOTER CONTENT */
.footer-content {
    margin-top: 20px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 40px;
}
#band-logo {
    max-height: 60px;      /* auto-resize */
    width: auto;           /* keep proportions */
    margin: 0 20px;        /* spacing between the two footer items */
    opacity: 0.9;          /* optional */
    pointer-events: none;  /* prevents blocking clicks */
}

.footer-item { display: flex; flex-direction: column; }
.label { font-size: 0.8em; color: #777; text-transform: uppercase; letter-spacing: 2px; }
.value { font-size: 2.5em; font-weight: bold; font-family: monospace; color: #f1c40f; }
#time-rem { color: #00FFCC; }
.warning { color: #FF4444 !important; }

    </style>
</head>
<body>

<!-- MODE TOGGLE -->
<div id="mode-toggle">
    <button id="mode-vocal" class="mode-btn active">Vocal Mode</button>
    <button id="mode-setlist" class="mode-btn">Setlist Mode</button>
</div>

<!-- FLOATING CONTROLS -->
<button id="floating-transport">PLAY</button>
<button id="floating-repeat">
    <span>LOOP</span>
    <span id="repeat-status">OFF</span>
</button>

<!-- VOCAL LYRICS VIEW -->
<div id="text">
    <h1>MOTJAW READY</h1>
</div>

<!-- SETLIST VIEW -->
<div id="setlist-container">
    <div id="setlist-inner"></div>
</div>

<!-- FOOTER -->
<div id="footer">
    <div id="region-layer"></div>
    <div id="progress-bar"></div>
    <div id="playhead"></div>

    <div class="footer-content">
        <div class="footer-item">
            <span class="label">Time Remaining</span>
            <span id="time-rem" class="value">0:00.000</span>
        </div>

        <!-- CENTER LOGO -->
        <img id="band-logo" src="logo.gif" alt="Band Logo">

        <div class="footer-item" style="text-align: right;">
            <span class="label">Next Track</span>
            <span id="next-track-name" class="value" style="font-size: 1.8em;">---</span>
        </div>
    </div>
</div>


<script src="main.js"></script>
<script>
wwr_start();
wwr_req_recur("GET/EXTSTATE/XR_Lyrics/need_refresh;TRANSPORT",10);

var div = document.getElementById('text');
var json = { end_time: 0, next_project: "---", entry: [], regions: [], setlist: [] };
var paragraphs = [];
var setlistItems = [];
var currentMode = "vocal";
var lastSetlistIndex = -1;

/* MODE SWITCHING */
const btnVocal = document.getElementById('mode-vocal');
const btnSetlist = document.getElementById('mode-setlist');
const setlistContainer = document.getElementById('setlist-container');

btnVocal.onclick = () => {
    currentMode = "vocal";
    btnVocal.classList.add('active');
    btnSetlist.classList.remove('active');
    div.style.display = "block";
    setlistContainer.style.display = "none";
};

btnSetlist.onclick = () => {
    currentMode = "setlist";
    btnSetlist.classList.add('active');
    btnVocal.classList.remove('active');
    div.style.display = "none";
    setlistContainer.style.display = "block";
};

/* PLAY / LOOP BUTTON BEHAVIOR */
const transportBtn = document.getElementById('floating-transport');
const repeatBtn = document.getElementById('floating-repeat');

transportBtn.onclick = () => {
    if (currentMode === "setlist") return;
    wwr_req('40345;40939;40044');
};

repeatBtn.onclick = () => {
    if (currentMode === "setlist") return;
    wwr_req('1068');
};

function formatTime(s) {
    if (s < 0 || isNaN(s)) return "0:00.000";
    var m = Math.floor(s / 60);
    var sec = Math.floor(s % 60);
    return (m < 10 ? "0" + m : m) + ":" + (sec < 10 ? "0" + sec : sec);
}

function drawRegions() {
    let layer = document.getElementById("region-layer");
    layer.innerHTML = "";

    if (!json.regions) return;

    for (let r of json.regions) {
        let startPct = (r.start / json.end_time) * 100;
        let widthPct = ((r.end - r.start) / json.end_time) * 100;

        let div = document.createElement("div");
        div.className = "region-block";
        div.style.left = startPct + "%";
        div.style.width = widthPct + "%";
        div.style.background = r.color;

        layer.appendChild(div);
    }
}

/* Build Setlist UI */
function buildSetlist() {
    const inner = document.getElementById('setlist-inner');
    inner.innerHTML = "";
    setlistItems = [];

    if (!json.setlist) return;

    json.setlist.forEach((name, idx) => {
        const item = document.createElement('div');
        item.className = "setlist-item";
        item.textContent = name;
        item.dataset.index = idx;
        inner.appendChild(item);
        setlistItems.push(item);
    });
}

/* Highlight current song + loop blink */
function updateSetlistHighlight(loopOn) {
    if (!json.setlist || setlistItems.length === 0) return;

    let currentIndex = -1;

    if (json.next_project && json.next_project !== "END OF SET") {
        let nextIdx = json.setlist.indexOf(json.next_project);
        if (nextIdx > 0) currentIndex = nextIdx - 1;
        else if (nextIdx === 0) currentIndex = 0;
    } else {
        currentIndex = json.setlist.length - 1;
    }

    if (currentIndex < 0 || currentIndex >= setlistItems.length) return;

    setlistItems.forEach((item, idx) => {
        item.classList.remove('current', 'looping');
        if (idx === currentIndex) {
            item.classList.add('current');
            //if (loopOn) item.classList.add('looping');
        }
    });

    if (currentIndex !== lastSetlistIndex) {
        lastSetlistIndex = currentIndex;
        setlistItems[currentIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
}

/* Lyrics click scroll */
document.addEventListener('click', function(e){
    if(e.target.tagName=="P" && e.target.classList.contains('lyrics') ) {
        e.target.classList.add("current");
        e.target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
});

function wwr_onreply(results) {
    var ar = results.split("\n");
    for (var x=0; x<ar.length; x++) {
        var tok = ar[x].split("\t");
        
        if (tok[1] === "XR_Lyrics" && tok[2] === "need_refresh" && tok[3] === "true") {
            wwr_req("GET/EXTSTATE/XR_Lyrics/json;SET/EXTSTATE/XR_Lyrics/need_refresh/false");
        }

        if (tok[1] === "XR_Lyrics" && tok[2] === "json" && tok[3] !== "") {
            var text = tok[3].replaceAll(/\\n/g, "\n").replaceAll(/\\\\/g, "\\");
            json = JSON.parse(text);
            
            document.getElementById('next-track-name').innerText = json.next_project || "---";

            /* LYRICS */
            var t = [];
            if (json.entry) {
                for (let line of json.entry) {
                    t.push('<p class="lyrics" data-pos-start="' + line.pos_start + '" data-pos-end="' + line.pos_end + '">' + line.text + '</p>');
                }
            }
            div.innerHTML = t.join("\n");
            paragraphs = document.getElementsByTagName("p");

            drawRegions();
            buildSetlist();
        }

        if (tok[0] === "TRANSPORT") { 
            var playState = parseInt(tok[1]);
            var currentTime = parseFloat(tok[2]);
            var loopOn = (parseInt(tok[3]) === 1);

            /* PLAY BUTTON STATUS */
            if (playState === 1 || playState === 5) {
                transportBtn.innerText = "STOP";
                transportBtn.style.backgroundColor = "#FF0000";
                transportBtn.style.color = "#000";
            } else {
                transportBtn.innerText = "PLAY";
                transportBtn.style.backgroundColor = "#00FF00";
                transportBtn.style.color = "#000";
            }

            /* LOOP BUTTON STATUS */
            if (loopOn) {
                repeatBtn.classList.add("active");
                document.getElementById('repeat-status').innerText = "ON";
            } else {
                repeatBtn.classList.remove("active");
                document.getElementById('repeat-status').innerText = "OFF";
            }

            /* TIME REMAINING */
            var remaining = json.end_time - currentTime;
            var timerEl = document.getElementById('time-rem');
            timerEl.innerText = formatTime(remaining);
            
            if (remaining > 0 && remaining <= 15) timerEl.classList.add('warning');
            else timerEl.classList.remove('warning');

            /* PROGRESS BAR + PLAYHEAD */
            let pct = (json.end_time > 0) ? (currentTime / json.end_time) * 100 : 0;
            pct = Math.max(0, Math.min(100, pct));

            document.getElementById("progress-bar").style.width = pct + "%";
            document.getElementById("playhead").style.left = pct + "%";

            /* SCROLLING LYRICS */
            if (json.entry && paragraphs.length > 0 && currentMode === "vocal") {
                for (let p of paragraphs) {
                    if (currentTime >= parseFloat(p.dataset.posStart) - 0.000001 &&
                        currentTime <= parseFloat(p.dataset.posEnd)) {
                        if (!p.classList.contains("current")) {
                            p.classList.add("current");
                            if (playState > 0) {
                                p.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            }
                        }
                    } else {
                        p.classList.remove("current");
                    }
                }
            }

            /* SETLIST HIGHLIGHT */
            updateSetlistHighlight(loopOn);
        }
    }
}
</script>

</body>
</html>
